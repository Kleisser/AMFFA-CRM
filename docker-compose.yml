services:
  mysql:
    image: mysql:8.0
    container_name: amffa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: amffa_crm
      MYSQL_USER: amffa
      MYSQL_PASSWORD: Amffa2026#
      MYSQL_ROOT_PASSWORD: root2026#
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: amffa-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: amffa
      PMA_PASSWORD: Amffa2026#
    ports:
      - "8082:80"
    depends_on:
      - mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amffa-app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: amffa_crm
      DB_USERNAME: amffa
      DB_PASSWORD: Amffa2026#

  nginx:
    image: nginx:alpine
    container_name: amffa-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./frontend/dist:/var/www/frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  node:
    image: node:20-alpine
    container_name: amffa-node
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
      - ./gecros-bridge:/gecros-bridge
    command: sh -c "npm install && npm run build; (cd /gecros-bridge && npm install --no-audit --no-fund > /dev/null 2>&1; node src/server.js > /tmp/bridge.log 2>&1 &); sleep infinity"
    depends_on:
      - app

volumes:
  mysql_data:
